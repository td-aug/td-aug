name: tdaug
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.0
  - scipy=1.14.1
  - tqdm=4.66
  - wandb=0.18.5
  - pip:
      # JAX / OGBench base.
      - distrax==0.1.5
      - flax==0.10.0
      - "jax[cuda12]==0.4.35"
      - jaxlib==0.4.34
      # JAX 0.4.35 requires the older NVCC Python package layout.
      - nvidia-cuda-nvcc-cu12==12.6.77
      - nvidia-cudnn-cu12==9.5.1.17
      - optax==0.2.3
      - chex==0.1.87
      - gymnasium==1.0.0
      - gymnasium-robotics==1.3.1
      - ogbench==1.0.1
      - mujoco==3.1.6
      - dm-control==1.0.20
      - matplotlib==3.9.2
      - moviepy==1.0.3
      - ml_collections==0.1.1
      - PyOpenGL-accelerate

      # Added for TDFlow / flow matching / EMD evaluation.
      - diffrax==0.6.0
      - ott-jax==0.4.9
      - orbax-checkpoint==0.8.0
      - tensorflow-probability==0.24.0
      - scikit-learn==1.7.1
